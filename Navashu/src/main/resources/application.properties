# Server Configuration
server.port=8080
server.servlet.context-path=/
spring.application.name=Navashu
spring.application.version=35.4.0

# PostgreSQL Database Configuration (v9.4+)
spring.datasource.url=jdbc:postgresql://localhost:5432/navashu_db
spring.datasource.username=postgres
spring.datasource.password=Navneit#21
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL94Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration
spring.datasource.max-active=20
spring.datasource.max-idle=10
spring.datasource.min-idle=5

# Logging Configuration
logging.level.root=INFO
logging.level.com.navashu=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Mail Configuration (for password reset emails)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT Configuration
jwt.secret=your-secret-key-here-minimum-32-characters-long
jwt.expiration=86400000

# Application Configuration
app.name=Navashu Authentication Service
app.version=35.4.0

