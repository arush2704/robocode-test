# Test Application Configuration
# This configuration is used when running tests

# Server Configuration
server.port=8080
server.servlet.context-path=/

# PostgreSQL Test Database
spring.datasource.url=jdbc:postgresql://localhost:5432/navashu_test_db
spring.datasource.username=postgres
spring.datasource.password=Navneit#21
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 In-Memory Database for tests (uncomment to use H2 instead of PostgreSQL)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL94Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable lazy initialization warnings
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Logging Configuration
logging.level.root=WARN
logging.level.com.navashu=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.hibernate=WARN

# Mail Configuration (mock)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
jwt.secret=test-secret-key-minimum-32-characters-long-for-testing
jwt.expiration=3600000

# Application Configuration
app.name=Navashu Authentication Service - Test
app.version=35.4.0

